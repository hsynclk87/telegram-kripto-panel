<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050a08">
<title>Canlı Binance Fiyatı</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/klinecharts@10.1.1/dist/umd/klinecharts.min.js"></script>
<style>
:root{color-scheme:dark;font-family:Arial,system-ui,sans-serif;background:#050a08;color:#edf3fa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:18px 12px 40px;background:#050a08;overflow-x:hidden;overflow-y:auto}
#matrix{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.48}
main{position:relative;z-index:1;width:min(100%,1280px);margin:0 auto;text-align:center;text-shadow:0 2px 18px #000}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:30px}
.brand{font-size:12px;font-weight:800;letter-spacing:.2em;color:#91a6bd}
.status{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.1em;color:#8498ae}
.dot{width:7px;height:7px;border-radius:50%;background:#d69a42}.dot.on{background:#20d99b;box-shadow:0 0 10px #20d99b}
select,button{appearance:none;background:#101c2a;color:#eaf2fc;border:1px solid #2b4057;border-radius:9px;padding:11px 13px;font-size:13px;font-weight:700;outline:none}
select{max-width:100%}button{cursor:pointer}button:active{transform:translateY(1px)}
.pair{margin-top:30px;font-size:13px;letter-spacing:.16em;color:#8da3ba;font-weight:700}
.price{margin:18px 0 10px;font-size:clamp(48px,12vw,100px);line-height:1.05;font-weight:750;letter-spacing:-.055em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.unit{font-size:13px;color:#8298b0;letter-spacing:.18em}
#chart-section{margin:34px auto 0;width:100%;text-align:left;background:rgba(5,12,17,.96);border:1px solid rgba(74,116,133,.35);border-radius:14px;overflow:hidden;box-shadow:0 12px 45px rgba(0,0,0,.35)}
#chart-heading{padding:14px 16px;color:#a9c2cf;font-size:12px;font-weight:800;letter-spacing:.14em;border-bottom:1px solid rgba(74,116,133,.25)}
#chart-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border-bottom:1px solid rgba(74,116,133,.2)}
#chart-tools .tool-label{font-size:10px;letter-spacing:.1em;color:#91a6bd;font-weight:800;margin-right:2px}
#chart-tools select{min-width:110px;flex:1}
#chart-tools button{white-space:nowrap}
#indicator-count{font-size:11px;color:#a9c2cf;padding:0 5px;font-variant-numeric:tabular-nums}
#chart{width:100%;height:min(76vh,780px);min-height:560px;background:#080f16}
#chart-error{display:none;padding:22px;color:#ffb7b7;font-size:13px}
@media(max-width:600px){body{padding:12px 8px 28px}.price{font-size:clamp(42px,12vw,68px)}#chart-section{margin-top:26px;border-radius:10px}#chart{height:680px;min-height:620px}#chart-tools{gap:7px}#chart-tools select{min-width:calc(50% - 8px)}}
</style>
</head>
<body>
<canvas id="matrix" aria-hidden="true"></canvas>
<main>
<div class="top"><div class="brand">LIVE PRICE</div><div class="status"><i class="dot" id="dot"></i><span id="status">BINANCE BAĞLANIYOR</span></div></div>
<select id="symbol" aria-label="Coin seç">
<option value="BTCUSDT">BTC / USDT</option><option value="ETHUSDT">ETH / USDT</option><option value="SOLUSDT">SOL / USDT</option><option value="BNBUSDT">BNB / USDT</option><option value="XRPUSDT">XRP / USDT</option><option value="DOGEUSDT">DOGE / USDT</option><option value="LINKUSDT">LINK / USDT</option><option value="AVAXUSDT">AVAX / USDT</option><option value="HBARUSDT">HBAR / USDT</option>
</select>
<div class="pair" id="pair">BTC / USDT</div><div class="price" id="price">—</div><div class="unit">USDT</div>
<section id="chart-section">
<div id="chart-heading">CANLI BINANCE GRAFİĞİ · TEKNİK ANALİZ</div>
<div id="chart-tools">
<span class="tool-label">PERİYOT</span>
<select id="period" aria-label="Grafik periyodu"><option value="1m">1 DK</option><option value="5m">5 DK</option><option value="15m" selected>15 DK</option><option value="1h">1 SAAT</option><option value="4h">4 SAAT</option><option value="1d">1 GÜN</option></select>
<span class="tool-label">GÖSTERGE</span>
<select id="indicator" aria-label="Gösterge seç"></select>
<button id="add-indicator" type="button">+ EKLE</button>
<button id="remove-indicator" type="button">SON GÖSTERGEYİ SİL</button>
<span id="indicator-count">0 gösterge</span>
</div>
<div id="chart"></div><div id="chart-error"></div>
</section>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const symbols=['btcusdt','ethusdt','solusdt','bnbusdt','xrpusdt','dogeusdt','linkusdt','avaxusdt','hbarusdt'];
const prices=Object.create(null);let socket=null,retryTimer=null,retryDelay=500,stopped=false;
let matrixTone='#00e676',lastSelectedPrice=null;
const canvas=$('matrix'),ctx=canvas.getContext('2d');let drops=[],fontSize=15;
const glyphs='アカサタナハマヤラワ012345789ABCDEFGHIJKLMNOPQRSTUVWXYZ$+-*<>アイウエオカキクケコ';
function resizeMatrix(){const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.floor(innerWidth*dpr);canvas.height=Math.floor(innerHeight*dpr);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);drops=Array.from({length:Math.ceil(innerWidth/fontSize)},()=>Math.random()*-80);}
function drawMatrix(){ctx.fillStyle='rgba(0,0,0,.105)';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.font='bold '+fontSize+'px monospace';ctx.fillStyle=matrixTone;for(let i=0;i<drops.length;i++){const ch=glyphs[Math.floor(Math.random()*glyphs.length)],x=i*fontSize,y=drops[i]*fontSize;ctx.fillText(ch,x,y);if(y>innerHeight&&Math.random()>.975)drops[i]=Math.random()*-30;drops[i]+=.72+Math.random()*.45;}requestAnimationFrame(drawMatrix);}
resizeMatrix();window.addEventListener('resize',resizeMatrix);requestAnimationFrame(drawMatrix);
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand();}
const format=value=>{const n=Number(value);if(!Number.isFinite(n)||n<=0)return'—';const digits=n>=1000?2:n>=1?4:n>=.01?6:8;return n.toLocaleString('en-US',{minimumFractionDigits:digits,maximumFractionDigits:digits});};
function status(connected,label){$('status').textContent=label;$('dot').classList.toggle('on',connected);}
function connectPrice(){clearTimeout(retryTimer);if(stopped)return;socket=new WebSocket('wss://stream.binance.com:9443/stream?streams='+symbols.map(s=>s+'@trade').join('/'));socket.onopen=()=>{retryDelay=500;status(true,'CANLI');};socket.onmessage=event=>{let packet;try{packet=JSON.parse(event.data);}catch{return;}const trade=packet.data;if(!trade||trade.e!=='trade')return;const symbol=trade.s,price=Number(trade.p);if(!Number.isFinite(price)||price<=0)return;prices[symbol]=price;if(symbol===$('symbol').value){if(lastSelectedPrice!==null&&price!==lastSelectedPrice)matrixTone=price>lastSelectedPrice?'#00f58a':'#ff263d';lastSelectedPrice=price;$('price').textContent=format(price);}};socket.onerror=()=>{try{socket.close();}catch{}};socket.onclose=()=>{status(false,'YENİDEN BAĞLANIYOR');retryTimer=setTimeout(connectPrice,retryDelay);retryDelay=Math.min(retryDelay*2,8000);};}
const indicatorNames=['MA','EMA','SMA','BBI','VOL','MACD','BOLL','KDJ','RSI','BIAS','BRAR','CCI','DMI','CR','PSY','DMA','TRIX','OBV','VR','WR','MTM','EMV','SAR','AO','ROC','PVT','AVP'];
let chart=null,indicatorCount=0;
const periods={ '1m':{span:1,type:'minute'},'5m':{span:5,type:'minute'},'15m':{span:15,type:'minute'},'1h':{span:1,type:'hour'},'4h':{span:4,type:'hour'},'1d':{span:1,type:'day'} };
function fillIndicators(){const sel=$('indicator');for(const name of indicatorNames){const op=document.createElement('option');op.value=name;op.textContent=name;sel.appendChild(op);}}
function updateIndicatorCount(){indicatorCount=chart?chart.getIndicators().length:0;$('indicator-count').textContent=indicatorCount+' gösterge';}
function addIndicator(){if(!chart)return;const name=$('indicator').value;try{const overlay=['MA','EMA','SMA','BBI','BOLL','SAR'].includes(name);chart.createIndicator(overlay?{name,paneId:'candle_pane'}:name,overlay);updateIndicatorCount();}catch(e){console.error('Indicator error',name,e);}}
function removeIndicator(){if(!chart)return;const all=chart.getIndicators();if(!all.length)return;const last=all[all.length-1];chart.removeIndicator({id:last.id});updateIndicatorCount();}
function intervalToPeriod(interval){return periods[interval]||periods['15m'];}
function intervalMs(interval){return ({'1m':60000,'5m':300000,'15m':900000,'1h':3600000,'4h':14400000,'1d':86400000})[interval]||900000;}
function normalizeKline(k){return {timestamp:Number(k[0]),open:Number(k[1]),high:Number(k[2]),low:Number(k[3]),close:Number(k[4]),volume:Number(k[5]),turnover:Number(k[7])};}
const subscriptions=new Map();
function makeDataLoader(){
 return {
  async getBars({type,timestamp,symbol,period,callback}){
   const interval=$('period').value,ticker=symbol.ticker||$('symbol').value;
   const params=new URLSearchParams({symbol:ticker,interval,limit:'1000'});
   if(type==='forward'&&timestamp)params.set('endTime',String(timestamp-1));
   if(type==='backward'){callback([],{backward:false});return;}
   const response=await fetch('https://api.binance.com/api/v3/klines?'+params.toString());
   if(!response.ok)throw new Error('Binance geçmiş mum API hatası: '+response.status);
   const raw=await response.json(),bars=raw.map(normalizeKline).sort((a,b)=>a.timestamp-b.timestamp);
   callback(bars,{forward:raw.length===1000,backward:false});
  },
  subscribeBar({symbol,period,callback}){
   const ticker=(symbol.ticker||$('symbol').value).toLowerCase(),interval=$('period').value,key=ticker+'_'+interval;
   const ws=new WebSocket('wss://stream.binance.com:9443/ws/'+ticker+'@kline_'+interval);
   ws.onmessage=event=>{let msg;try{msg=JSON.parse(event.data);}catch{return;}const k=msg.k;if(!k)return;callback({timestamp:Number(k.t),open:Number(k.o),high:Number(k.h),low:Number(k.l),close:Number(k.c),volume:Number(k.v),turnover:Number(k.q)});};
   ws.onerror=()=>{try{ws.close();}catch{}};
   subscriptions.set(key,ws);
  },
  unsubscribeBar({symbol,period}){
   const ticker=(symbol.ticker||$('symbol').value).toLowerCase(),interval=$('period').value,key=ticker+'_'+interval,ws=subscriptions.get(key);
   if(ws){try{ws.close();}catch{}subscriptions.delete(key);}
  }
 };
}
function initializeChart(){
 if(!window.klinecharts||!window.klinecharts.init){$('chart-error').style.display='block';$('chart-error').textContent='Grafik kütüphanesi yüklenemedi. İnternet bağlantısını kontrol edin.';return;}
 chart=window.klinecharts.init('chart');
 chart.setStyles({grid:{horizontal:{color:'#182531'},vertical:{color:'#182531'}},candle:{bar:{upColor:'#16c784',downColor:'#ea3943',noChangeColor:'#9aa4ad',upBorderColor:'#16c784',downBorderColor:'#ea3943',upWickColor:'#16c784',downWickColor:'#ea3943'}},technicalIndicator:{bar:{upColor:'#16c784',downColor:'#ea3943',noChangeColor:'#9aa4ad'}}});
 chart.setSymbol({ticker:$('symbol').value,pricePrecision:8,volumePrecision:4});
 chart.setPeriod(intervalToPeriod($('period').value));
 chart.setDataLoader(makeDataLoader());
 chart.createIndicator('VOL');
 updateIndicatorCount();
}
function changeSymbol(){const symbol=$('symbol').value;lastSelectedPrice=prices[symbol]??null;$('pair').textContent=symbol.replace('USDT',' / USDT');$('price').textContent=format(prices[symbol]);if(chart)chart.setSymbol({ticker:symbol,pricePrecision:8,volumePrecision:4});}
function changePeriod(){if(chart)chart.setPeriod(intervalToPeriod($('period').value));}
fillIndicators();initializeChart();$('symbol').addEventListener('change',changeSymbol);$('period').addEventListener('change',changePeriod);$('add-indicator').addEventListener('click',addIndicator);$('remove-indicator').addEventListener('click',removeIndicator);connectPrice();
window.addEventListener('pagehide',()=>{stopped=true;clearTimeout(retryTimer);if(socket)socket.close();for(const ws of subscriptions.values())try{ws.close();}catch{}if(chart&&window.klinecharts.dispose)window.klinecharts.dispose('chart');});
})();
</script>
</body>
</html>
