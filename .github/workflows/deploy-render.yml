name: Deploy analysis engine to Render

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "render.yaml"
      - ".github/workflows/deploy-render.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment when configured
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::notice::Render service is not connected yet. Add the deploy hook URL as the RENDER_DEPLOY_HOOK GitHub Actions secret."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
          echo "Render deployment triggered."
