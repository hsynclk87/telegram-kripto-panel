name: Analysis Engine CI

on:
  push:
    branches: [main, "feature/analysis-engine-v1"]
    paths:
      - "engine/**"
      - ".github/workflows/engine-ci.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/engine-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Syntax checks
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build Docker image
        run: docker build -t telegram-kripto-analysis-engine .
      - name: Container startup and API smoke test
        run: |
          docker run -d --name engine-smoke -p 8080:8080 -e SYMBOLS=BTCUSDT telegram-kripto-analysis-engine
          cleanup() { docker logs engine-smoke || true; docker rm -f engine-smoke || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 25); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/health
          curl --fail --silent http://127.0.0.1:8080/api/v1/snapshot?symbol=BTCUSDT
          curl --fail --silent http://127.0.0.1:8080/api/v1/analysis?symbol=BTCUSDT
          curl --fail --silent http://127.0.0.1:8080/api/v1/market-signals?symbol=BTCUSDT
          curl --fail --silent http://127.0.0.1:8080/api/v1/whales
          node --input-type=module <<'NODE'
          const deadline = Date.now() + 20000;
          let health;
          while (Date.now() < deadline) {
            const response = await fetch("http://127.0.0.1:8080/api/v1/health");
            health = await response.json();
            const exchanges = health.exchanges || {};
            if (exchanges.binanceSpot?.connected && exchanges.binanceFutures?.connected && exchanges.bybitLinear?.connected) break;
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          const exchanges = health?.exchanges || {};
          const disconnected = ["binanceSpot", "binanceFutures", "bybitLinear"].filter((name) => !exchanges[name]?.connected);
          if (disconnected.length) throw new Error("Exchange WebSocket smoke test failed: " + disconnected.join(", "));
          const signals = await (await fetch("http://127.0.0.1:8080/api/v1/market-signals?symbol=BTCUSDT")).json();
          if (!signals[0]?.warmedUp) throw new Error("Historical 1m candle warmup did not complete");
          console.log("Live feed smoke test passed:", Object.keys(exchanges).join(", "), "history candles:", signals[0].historyCandles);
          NODE
