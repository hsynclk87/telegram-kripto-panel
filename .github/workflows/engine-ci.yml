name: Live Price Mini App CI

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "index.html"
      - ".github/workflows/engine-ci.yml"
  pull_request:
    paths:
      - "engine/**"
      - "index.html"
      - ".github/workflows/engine-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - run: docker build -t telegram-live-price-mini-app .
      - name: HTTP smoke test
        run: |
          docker run -d --name price-smoke -p 8080:8080 telegram-live-price-mini-app
          cleanup() { docker logs price-smoke || true; docker rm -f price-smoke || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/health
          curl --fail --silent http://127.0.0.1:8080/ | grep -q "MATRIX"
          curl --fail --silent http://127.0.0.1:8080/analysis-core.js | grep -q "normalizeKlines"
          curl --fail --silent -D - -o /dev/null -H "Origin: https://hsynclk87.github.io" http://127.0.0.1:8080/analysis-core.js | grep -qi "Access-Control-Allow-Origin: https://hsynclk87.github.io"
