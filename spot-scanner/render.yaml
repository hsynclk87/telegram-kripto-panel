services:
  - type: web
    name: project-7-spot-scanner
    runtime: docker
    plan: free
    dockerfilePath: ./spot-scanner/Dockerfile
    dockerContext: ./spot-scanner
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: UNIVERSE_SIZE
        value: 100
      - key: SCAN_INTERVAL_MS
        value: 5000
      - key: DATA_DIR
        value: /tmp/spot-scanner-data
