@media(max-width:759px){#oscLab{padding-left:12px;padding-right:12px}.osc-layout{grid-template-columns:minmax(0,1fr)}.osc-card{padding:13px;border-radius:13px}#oscCanvas{height:280px}.osc-layout>.osc-card:last-child{margin-bottom:20px}#oscList{grid-template-columns:repeat(2,minmax(0,1fr));max-height:none}.osc-item{grid-template-columns:23px minmax(0,1fr);gap:7px;padding:9px}.osc-item:before{width:22px;height:22px}.osc-item small{grid-column:2;white-space:normal}.osc-library-tools{grid-template-columns:1fr 1fr}}

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),symbols=['btcusdt','ethusdt','solusdt','bnbusdt','xrpusdt','dogeusdt','linkusdt','avaxusdt','hbarusdt'];
const prices=Object.create(null);let socket=null,retryTimer=null,retryDelay=500,stopped=false,matrixTone='#00e676',lastSelectedPrice=null;
const canvas=$('matrix'),ctx=canvas.getContext('2d');let drops=[],fontSize=15,columns=0;
const glyphs='アカサタナハマヤラワ012345789ABCDEFGHIJKLMNOPQRSTUVWXYZ$+-*<>アイウエオカキクケコ';
function resizeMatrix(){const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.floor(innerWidth*dpr);canvas.height=Math.floor(innerHeight*dpr);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);columns=Math.ceil(innerWidth/fontSize);drops=Array.from({length:columns},()=>Math.random()*-80);}
function drawMatrix(){ctx.fillStyle='rgba(0,0,0,.105)';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.font='bold '+fontSize+'px monospace';ctx.fillStyle=matrixTone;for(let i=0;i<drops.length;i++){const ch=glyphs[Math.floor(Math.random()*glyphs.length)];const x=i*fontSize,y=drops[i]*fontSize;ctx.fillText(ch,x,y);if(y>innerHeight&&Math.random()>.975)drops[i]=Math.random()*-30;drops[i]+=.72+Math.random()*.45;}requestAnimationFrame(drawMatrix);}
resizeMatrix();window.addEventListener('resize',resizeMatrix);requestAnimationFrame(drawMatrix);
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand();}
const format=value=>{const n=Number(value);if(!Number.isFinite(n)||n<=0)return'—';const digits=n>=1000?2:n>=1?4:n>=.01?6:8;return n.toLocaleString('en-US',{minimumFractionDigits:digits,maximumFractionDigits:digits});};
function render(){const symbol=$('symbol').value;lastSelectedPrice=prices[symbol]??null;$('pair').textContent=symbol.replace('USDT',' / USDT');$('price').textContent=format(prices[symbol]);}
function status(connected,label){$('status').textContent=label;$('dot').classList.toggle('on',connected);}
function connect(){clearTimeout(retryTimer);if(stopped)return;const streams=symbols.map(s=>s+'@trade').join('/');socket=new WebSocket('wss://stream.binance.com:9443/stream?streams='+streams);socket.onopen=()=>{retryDelay=500;status(true,'CANLI');};socket.onmessage=event=>{let packet;try{packet=JSON.parse(event.data);}catch{return;}const trade=packet.data;if(!trade||trade.e!=='trade')return;const symbol=trade.s,price=Number(trade.p);if(!Number.isFinite(price)||price<=0)return;prices[symbol]=price;if(symbol===$('symbol').value){if(lastSelectedPrice!==null&&price!==lastSelectedPrice)matrixTone=price>lastSelectedPrice?'#00f58a':'#ff263d';lastSelectedPrice=price;$('price').textContent=format(price);}};socket.onerror=()=>{try{socket.close();}catch{}};socket.onclose=()=>{status(false,'YENİDEN BAĞLANIYOR');retryTimer=setTimeout(connect,retryDelay);retryDelay=Math.min(retryDelay*2,8000);};}
$('symbol').addEventListener('change',render);render();connect();window.addEventListener('pagehide',()=>{stopped=true;clearTimeout(retryTimer);if(socket)socket.close();});
})();
</script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
if(!$('oscLabBtn'))return;
const defs=[
['rsi','RSI','Momentum','Fiyatın son dönemlerdeki yükseliş ve düşüş gücünü ölçer. 70 üzeri güçlü/şişmiş, 30 altı zayıf/aşırı satım bölgesidir. Uyumsuzlukta fiyat dip/tepe yaparken RSI gücünün bunu doğrulayıp doğrulamadığı izlenir.'],

['mfi','MFI','Para Akışı','Hacmi de hesaba katan para akışı osilatörüdür. 80 üzeri alım baskısının, 20 altı satış baskısının aşırılaşabileceğini gösterir. Fiyatla uyumsuzluğu akışın fiyatı doğrulamadığına işaret edebilir.'],

['obv','OBV','Hacim','Yükseliş mumlarında hacmi ekleyip düşüş mumlarında çıkararak birikimli hacim akışı üretir. Mutlak seviyesi değil eğimi ve fiyatla göreli dip/tepe yapısı önemlidir.'],

['macd','MACD Histogram','Momentum','MACD çizgisi ile sinyal çizgisi arasındaki farkı gösterir. Histogramın küçülmesi momentumun zayıfladığını, büyümesi güçlendiğini anlatır. Sıfır çizgisi trend bağlamı sağlar.'],
['cmf','Chaikin Money Flow','Para Akışı','Kapanışın mum aralığındaki konumu ile hacmi birleştirir. Sıfır üzeri net alım, sıfır altı net satış baskısını gösterir. Fiyatla ayrışma akış teyidinin zayıfladığını anlatabilir.'],

['momentum','Momentum','Momentum','Mevcut fiyat ile geçmiş fiyat arasındaki farktır. Sıfır üzeri pozitif, sıfır altı negatif momentum gösterir. Kendi geçmişi ve fiyat salınımlarıyla kıyaslanır.'],
['cmo','CMO','Momentum','Yukarı ve aşağı kapanış değişimlerini karşılaştırır; -100 ile +100 arasında salınır. Pozitif değerler yukarı, negatif değerler aşağı momentum üstünlüğünü gösterir.'],
['tsi','TSI','Momentum','Çift yumuşatılmış fiyat momentumunu ölçer. Sıfır çizgisi yön filtresi, sinyal çizgisi kesişimleri momentum değişimi için kullanılır. Uyumsuzluklar dönüşün erken uyarısı olabilir.'],
