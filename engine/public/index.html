<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050a08">
<title>Canlı Binance Fiyatı</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;font-family:Arial,system-ui,sans-serif;background:#050a08;color:#edf3fa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#050a08;overflow:hidden}
#matrix{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.58}
main{position:relative;z-index:1;text-shadow:0 2px 18px #000;width:min(100%,680px);text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:clamp(65px,17vh,145px)}
.brand{font-size:12px;font-weight:800;letter-spacing:.2em;color:#91a6bd}
.status{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.1em;color:#8498ae}
.dot{width:7px;height:7px;border-radius:50%;background:#d69a42}.dot.on{background:#20d99b;box-shadow:0 0 10px #20d99b}
select{appearance:none;background:#101c2a;color:#eaf2fc;border:1px solid #2b4057;border-radius:10px;padding:12px 42px 12px 16px;font-size:14px;font-weight:700;text-align:center;outline:none}
.pair{margin-top:30px;font-size:13px;letter-spacing:.16em;color:#8da3ba;font-weight:700}
.price{margin:18px 0 10px;font-size:clamp(48px,12vw,100px);line-height:1.05;font-weight:750;letter-spacing:-.055em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.unit{font-size:13px;color:#8298b0;letter-spacing:.18em}
#oscLabBtn{margin-top:28px;background:#10251f;border:1px solid #1e7658;color:#a8f5d6;border-radius:12px;padding:12px 18px;font-weight:700;letter-spacing:.04em}
#oscLab{display:none;position:fixed;inset:0;z-index:5;background:#071018;color:#eaf2fc;text-shadow:none;overflow:auto;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
#oscLab.show{display:block}.osc-head{position:sticky;top:0;background:#071018;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #203447}
.osc-head strong{font-size:15px;letter-spacing:.08em}.osc-head button,.osc-actions button{background:#142333;border:1px solid #2b4057;color:#eaf2fc;border-radius:9px;padding:9px 12px}
.osc-controls{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0}.osc-controls select{padding:9px 12px;font-size:12px}
.osc-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}.osc-card{background:#0c1925;border:1px solid #203447;border-radius:13px;padding:12px;min-width:0}
.osc-title{display:flex;justify-content:space-between;align-items:center;gap:8px}.osc-title h2{font-size:17px;margin:0}.osc-chip{font-size:10px;color:#91b9d0;background:#142b3b;padding:5px 8px;border-radius:20px}
#oscCanvas{display:block;width:100%;height:280px;margin-top:10px;background:#091521;border-radius:8px}
#oscExplain{font-size:13px;line-height:1.5;color:#b7c8d8;margin-top:9px}
#oscLoading{font-size:11px;color:#7f9bb0;margin-top:8px}
.osc-signals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px}
.osc-signal{border-radius:8px;padding:9px;background:#102b25;border-left:3px solid #20d99b;min-width:0}.osc-signal.bear{background:#301820;border-color:#ff5268}.osc-signal b{display:block;font-size:12px}.osc-signal small{display:block;font-size:10px;color:#a9bdcd;margin-top:4px}
.osc-empty{grid-column:1/-1;color:#8da3ba;font-size:12px;padding:12px}
#oscList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.osc-item{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:#0c1925;border:1px solid #203447;border-radius:9px;color:#dce8f3;padding:9px;min-width:0}
.osc-item.active{border-color:#20d99b;background:#10251f}.osc-item b{font-size:12px}.osc-item small{font-size:10px;color:#8da3ba}
@media(min-width:760px){#oscLab{padding-left:max(20px,calc((100vw - 1100px)/2));padding-right:max(20px,calc((100vw - 1100px)/2))}.osc-layout{grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr)}#oscList{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:480px){.top{margin-bottom:20vh}.price{font-size:clamp(42px,12vw,68px)}#oscCanvas{height:245px}}

/* Oscillator Lab — premium terminal layout */
#oscLab{background:radial-gradient(ellipse at 15% 0%,rgba(23,74,91,.22),transparent 42%),#070d16;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);font-family:Inter,ui-sans-serif,system-ui,Arial,sans-serif}
.osc-head{background:rgba(7,13,22,.94);backdrop-filter:blur(16px);border-bottom:1px solid #203044;padding:15px 0}
.osc-head strong{font-size:13px;letter-spacing:.16em;color:#dce9f7}
.osc-head strong:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#32d6a0;box-shadow:0 0 12px #32d6a0;margin:0 10px 1px 0}
.osc-head button,.osc-actions button,#oscRefresh{background:#132236;border:1px solid #2b4059;color:#dce9f7;border-radius:10px;padding:10px 14px;font-size:11px;font-weight:800;letter-spacing:.06em}
.osc-controls{display:flex;gap:9px;flex-wrap:wrap;padding:16px 0}
.osc-controls select{background:#101d2c;border:1px solid #2b4059;border-radius:10px;padding:11px 14px;font-size:12px;min-width:112px}
.osc-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(290px,1fr);gap:14px;align-items:start}
.osc-card{background:linear-gradient(145deg,rgba(17,31,47,.98),rgba(10,20,32,.98));border:1px solid #253950;border-radius:16px;padding:16px;box-shadow:0 12px 32px rgba(0,0,0,.18)}
.osc-title{gap:12px}.osc-title h2{font-size:20px;letter-spacing:-.025em;color:#f1f6fc}.osc-chip{font-size:10px;font-weight:800;letter-spacing:.06em;color:#8bdcc4;background:#102d2b;border:1px solid #20584d;padding:6px 9px;border-radius:7px}
#oscCanvas{height:340px;margin-top:15px;background:linear-gradient(180deg,#091522,#0a1724);border:1px solid #1e3044;border-radius:12px}
#oscLoading{font-size:11px;color:#8ca3bb;margin-top:12px}
#oscExplain{font-size:12px;line-height:1.65;color:#b8c7d7;margin-top:12px;padding:12px 13px;background:rgba(5,13,23,.55);border:1px solid #1c3044;border-radius:10px}
.osc-signals{gap:9px;margin-top:12px}
.osc-signal{background:rgba(18,67,54,.45);border:1px solid rgba(41,179,132,.35);border-left:3px solid #26d69a;border-radius:10px;padding:11px}
.osc-signal.bull{background:rgba(18,67,54,.45);border-color:rgba(41,179,132,.35);border-left-color:#26d69a}
.osc-signal.bear{background:rgba(86,28,43,.35);border-color:rgba(231,75,102,.35);border-left-color:#f05270}
.osc-signal b{font-size:12px;color:#eaf3fb}.osc-signal small{font-size:10px;color:#a9bacb;line-height:1.5}
.osc-empty{background:#101e2c;border:1px dashed #30465d;border-radius:10px}
.osc-library-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.osc-library-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.osc-library-tools input,.osc-library-tools select{width:100%;min-width:0;background:#0a1724;border:1px solid #2a3d53;border-radius:9px;color:#dce8f3;padding:10px;font-size:11px;outline:none}
#oscList{display:grid;grid-template-columns:1fr;gap:7px;max-height:62vh;overflow:auto;padding-right:3px}
.osc-item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:9px;text-align:left;background:#0b1825;border:1px solid #1d3044;border-radius:10px;color:#dce8f3;padding:10px 11px;min-height:48px;transition:border-color .15s,background .15s}
.osc-item:before{content:attr(data-index);display:grid;place-items:center;width:25px;height:25px;border-radius:7px;background:#14273a;color:#8da8c2;font-size:9px;font-weight:800}
.osc-item b{font-size:11px;font-weight:750}.osc-item small{font-size:9px;color:#8198b0;white-space:nowrap}
.osc-item.active{border-color:#27c997;background:linear-gradient(90deg,rgba(24,92,72,.35),rgba(12,30,39,.8));box-shadow:inset 0 0 0 1px rgba(39,201,151,.12)}
.osc-item.active:before{background:#174b3d;color:#7cf0c5}
.osc-library-count{font-size:10px;color:#8096ac}
@media(max-width:759px){#oscLab{padding-left:12px;padding-right:12px}.osc-layout{grid-template-columns:minmax(0,1fr)}.osc-card{padding:13px;border-radius:13px}#oscCanvas{height:280px}.osc-layout>.osc-card:last-child{margin-bottom:20px}#oscList{grid-template-columns:repeat(2,minmax(0,1fr));max-height:none}.osc-item{grid-template-columns:23px minmax(0,1fr);gap:7px;padding:9px}.osc-item:before{width:22px;height:22px}.osc-item small{grid-column:2;white-space:normal}.osc-library-tools{grid-template-columns:1fr 1fr}}
@media(min-width:760px){#oscLab{padding-left:max(24px,calc((100vw - 1180px)/2));padding-right:max(24px,calc((100vw - 1180px)/2))}#oscList{max-height:690px}}
</style>
</head>
<body>
<canvas id="matrix" aria-hidden="true"></canvas>
<main>
<div class="top"><div class="brand">LIVE PRICE</div><div class="status"><i class="dot" id="dot"></i><span id="status">BINANCE BAĞLANIYOR</span></div></div>
<select id="symbol" aria-label="Coin seç">
<option value="BTCUSDT">BTC / USDT</option><option value="ETHUSDT">ETH / USDT</option><option value="SOLUSDT">SOL / USDT</option><option value="BNBUSDT">BNB / USDT</option><option value="XRPUSDT">XRP / USDT</option><option value="DOGEUSDT">DOGE / USDT</option><option value="LINKUSDT">LINK / USDT</option><option value="AVAXUSDT">AVAX / USDT</option><option value="HBARUSDT">HBAR / USDT</option>
</select>
<div class="pair" id="pair">BTC / USDT</div><div class="price" id="price">—</div><div class="unit">USDT</div>
<button id="oscLabBtn">GÖSTERGE LABORATUVARI</button>
</main>
<section id="oscLab" aria-label="Gösterge ve uyumsuzluk laboratuvarı">
<div class="osc-head"><strong>OSCILLATOR LAB</strong><button id="oscClose">KAPAT ✕</button></div>
<div class="osc-controls">
<select id="oscSymbol" aria-label="Analiz coin"><option>BTCUSDT</option><option>ETHUSDT</option><option>SOLUSDT</option><option>BNBUSDT</option><option>XRPUSDT</option><option>DOGEUSDT</option><option>LINKUSDT</option><option>AVAXUSDT</option><option>HBARUSDT</option></select>
<select id="oscTime" aria-label="Zaman dilimi"><option>5m</option><option selected>15m</option><option>1h</option><option>4h</option><option>1d</option></select>
<button id="oscRefresh">YENİLE</button>
</div>
<div class="osc-layout">
<div class="osc-card">
<div class="osc-title"><h2 id="oscName">RSI</h2><span class="osc-chip" id="oscGroup">Momentum</span></div>
<canvas id="oscCanvas"></canvas>
<div id="oscLoading">Veri bekleniyor…</div>
<div id="oscExplain"></div>
<div class="osc-title" style="margin-top:15px"><b>Uyumsuzluk tespitleri</b><span class="osc-chip" id="oscTF">15m</span></div>
<div id="oscSignals" class="osc-signals"></div>
</div>
<div class="osc-card"><div class="osc-library-head"><b>GÖSTERGE KÜTÜPHANESİ</b><span class="osc-library-count">33 ŞABLON</span></div><div class="osc-library-tools"><input id="oscSearch" type="search" placeholder="Gösterge ara…" aria-label="Gösterge ara"><select id="oscCategory" aria-label="Kategori filtrele"><option value="all">Tüm kategoriler</option><option>Momentum</option><option>Para Akışı</option><option>Hacim</option><option>Trend</option><option>Volatilite</option><option>Piyasa Akışı</option></select></div><div id="oscList"></div></div>
</div>
</section>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),symbols=['btcusdt','ethusdt','solusdt','bnbusdt','xrpusdt','dogeusdt','linkusdt','avaxusdt','hbarusdt'];
const prices=Object.create(null);let socket=null,retryTimer=null,retryDelay=500,stopped=false,matrixTone='#00e676',lastSelectedPrice=null;
const canvas=$('matrix'),ctx=canvas.getContext('2d');let drops=[],fontSize=15,columns=0;
const glyphs='アカサタナハマヤラワ012345789ABCDEFGHIJKLMNOPQRSTUVWXYZ$+-*<>アイウエオカキクケコ';
function resizeMatrix(){const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.floor(innerWidth*dpr);canvas.height=Math.floor(innerHeight*dpr);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);columns=Math.ceil(innerWidth/fontSize);drops=Array.from({length:columns},()=>Math.random()*-80);}
function drawMatrix(){ctx.fillStyle='rgba(0,0,0,.105)';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.font='bold '+fontSize+'px monospace';ctx.fillStyle=matrixTone;for(let i=0;i<drops.length;i++){const ch=glyphs[Math.floor(Math.random()*glyphs.length)];const x=i*fontSize,y=drops[i]*fontSize;ctx.fillText(ch,x,y);if(y>innerHeight&&Math.random()>.975)drops[i]=Math.random()*-30;drops[i]+=.72+Math.random()*.45;}requestAnimationFrame(drawMatrix);}
resizeMatrix();window.addEventListener('resize',resizeMatrix);requestAnimationFrame(drawMatrix);
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand();}
const format=value=>{const n=Number(value);if(!Number.isFinite(n)||n<=0)return'—';const digits=n>=1000?2:n>=1?4:n>=.01?6:8;return n.toLocaleString('en-US',{minimumFractionDigits:digits,maximumFractionDigits:digits});};
function renderList(){const q=($('oscSearch')?.value||'').trim().toLocaleLowerCase('tr-TR'),cat=$('oscCategory')?.value||'all';const items=defs.filter(x=>(cat==='all'||x[2]===cat)&&(!q||(x[1]+' '+x[2]+' '+x[3]).toLocaleLowerCase('tr-TR').includes(q)));$('oscList').innerHTML=items.map(x=>'<button class="osc-item '+(x[0]===state.selected?'active':'')+'" data-id="'+x[0]+'" data-index="'+String(defs.indexOf(x)+1).padStart(2,'0')+'"><b>'+x[1]+'</b><small>'+x[2]+'</small></button>').join('')||'<div class="osc-empty">Bu filtrede gösterge bulunamadı.</div>';$('oscList').querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.id;calculate();});}
function render(){const d=defs.find(x=>x[0]===state.selected);$('oscName').textContent=d[1];$('oscGroup').textContent=d[2];$('oscExplain').textContent=d[3];$('oscSymbol').value=state.symbol;$('oscTF').textContent=state.tf;$('oscSignals').innerHTML=state.divs.length?state.divs.slice(0,8).map(x=>'<div class="osc-signal '+(x.type.toLocaleLowerCase('tr-TR').includes('pozitif')?'bull':'bear')+'"><b>'+x.type+'</b><small>'+new Date(state.rows[x.b.i].t).toLocaleString('tr-TR')+' · Pivot onaylı</small></div>').join(''):'<div class="osc-empty">Seçili zaman diliminde doğrulanmış uyumsuzluk bulunamadı.</div>';renderList();draw();}
async function calculate(){const d=defs.find(x=>x[0]===state.selected);$('oscLoading').textContent='Binance geçmiş mumları yükleniyor…';try{const url='https://api.binance.com/api/v3/klines?symbol='+state.symbol+'&interval='+state.tf+'&limit=500';const res=await fetch(url);if(!res.ok)throw Error('Binance veri yanıtı: '+res.status);const raw=await res.json();state.rows=raw.map(x=>({t:x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+x[5],tb:+x[9]}));state.series=calc(state.selected,state.rows);state.divs=divergences(state.rows.map(x=>x.c),state.series);$('oscLoading').textContent='500 mum · Binance Spot · Son güncelleme '+new Date().toLocaleTimeString('tr-TR');render();}catch(e){$('oscLoading').textContent='Veri alınamadı: '+e.message;}}
function openLab(){ $('oscLab').classList.add('show');calculate();}
$('oscLabBtn').onclick=openLab;$('oscClose').onclick=()=>$('oscLab').classList.remove('show');
$('oscSymbol').addEventListener('change',e=>{state.symbol=e.target.value;calculate();});
$('oscTime').addEventListener('change',e=>{state.tf=e.target.value;calculate();});
$('oscRefresh').onclick=calculate;
renderList();$('oscSearch').addEventListener('input',renderList);$('oscCategory').addEventListener('change',renderList);
})();

</script>
</body>
</html>
